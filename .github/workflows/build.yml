name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform package to build"
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
      release:
        description: "Create tag + GitHub release (requires target=all)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  HL2SDK_REPO: alliedmodders/hl2sdk
  HL2SDK_REF: cs2
  MMSOURCE_REPO: alliedmodders/metamod-source
  MMSOURCE_REF: master

jobs:
  # Extracts the plugin version and validates release preconditions
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: ver
        run: |
          version=$(sed -nE 's/.*GetVersion\(\) override \{ return "([^"]+)".*/\1/p' src/plugin.cpp | head -1)
          test -n "$version" || { echo "::error::failed to extract the plugin version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BotVision $version"

      - name: Release preconditions
        if: inputs.release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" != "all" ]; then
            echo "::error::release requires target=all (got '$TARGET')"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "releasing v$VERSION"

  # Builds and assembles the complete Windows package
  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Checkout hl2sdk-cs2
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HL2SDK_REPO }}
          ref: ${{ env.HL2SDK_REF }}
          path: deps/hl2sdk-cs2

      - name: Checkout metamod-source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MMSOURCE_REPO }}
          ref: ${{ env.MMSOURCE_REF }}
          path: deps/metamod-source

      - name: Install protoc 3.21.12
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-win64.zip
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc.exe" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc.exe" --version | grep -q 'libprotoc 3\.21\.12'

      - name: Build package
        shell: pwsh
        env:
          HL2SDKCS2: ${{ github.workspace }}/deps/hl2sdk-cs2
          MMSOURCE_DEV: ${{ github.workspace }}/deps/metamod-source
          CSGO_PROTO: ${{ github.workspace }}/deps/hl2sdk-cs2/common
        run: ./build.ps1 -Windows

      - name: Verify package
        shell: bash
        run: |
          test -f dist/windows/addons/BotVision/bin/win64/BotVision.dll
          test -f dist/windows/addons/metamod/BotVision.vdf
          test ! -e dist/windows/addons/metamod/BotVision.linux.vdf

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: BotVision-Windows-${{ needs.guard.outputs.version }}
          path: dist/windows/
          if-no-files-found: error

  # Builds and assembles the complete Linux package
  linux:
    if: inputs.target == 'all' || inputs.target == 'linux'
    needs: guard
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Checkout hl2sdk-cs2
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HL2SDK_REPO }}
          ref: ${{ env.HL2SDK_REF }}
          path: deps/hl2sdk-cs2

      - name: Checkout metamod-source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MMSOURCE_REPO }}
          ref: ${{ env.MMSOURCE_REF }}
          path: deps/metamod-source

      - name: Install protoc 3.21.12
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version | grep -q 'libprotoc 3\.21\.12'

      - name: Configure + build
        env:
          HL2SDKCS2: ${{ github.workspace }}/deps/hl2sdk-cs2
          MMSOURCE_DEV: ${{ github.workspace }}/deps/metamod-source
          CSGO_PROTO: ${{ github.workspace }}/deps/hl2sdk-cs2/common
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Verify package
        run: |
          binary=build/package/addons/BotVision/bin/linuxsteamrt64/BotVision.so
          test -f "$binary"
          test -f build/package/addons/metamod/BotVision.vdf
          max_glibc=$(readelf --version-info "$binary" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sort -Vu \
            | tail -1)
          test -n "$max_glibc"
          if [ "$(printf '%s\n' GLIBC_2.31 "$max_glibc" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::$binary requires $max_glibc, newer than SteamRT3's GLIBC_2.31"
            exit 1
          fi
          echo "$binary requires at most $max_glibc"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: BotVision-Linux-${{ needs.guard.outputs.version }}
          path: build/package/
          if-no-files-found: error

  # Publishes both platform packages
  release:
    if: inputs.release
    needs: [guard, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: BotVision-*
          path: artifacts

      - name: Zip packages
        run: |
          cd artifacts
          for directory in */; do
            directory="${directory%/}"
            (cd "$directory" && zip -qr "../$directory.zip" .)
            echo "packed $directory.zip"
          done
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2

      - name: Create tag + release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
