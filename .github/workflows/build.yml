name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform package to build"
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
      release:
        description: "Create tag + GitHub release (requires target=all)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Extracts the plugin version and validates release preconditions
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: ver
        run: |
          version=$(sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+) LANGUAGES .*/\1/p' CMakeLists.txt | head -1)
          test -n "$version" || { echo "::error::failed to extract the plugin version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BotVision $version"

      - name: Release preconditions
        if: inputs.release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" != "all" ]; then
            echo "::error::release requires target=all (got '$TARGET')"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "releasing v$VERSION"

  # Builds the Windows package.
  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure + build
        run: |
          cmake -B build -A x64 -S .
          cmake --build build --config Release

      - name: Verify package
        shell: bash
        run: |
          test -f build/package/addons/BotVision/bin/win64/BotVision.dll
          test -f build/package/addons/metamod/BotVision.vdf
          test ! -e build/package/addons/metamod/BotVision.linux.vdf

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: BotVision-Windows-${{ needs.guard.outputs.version }}
          path: build/package/
          if-no-files-found: error

  # Builds and assembles the complete Linux package
  linux:
    if: inputs.target == 'all' || inputs.target == 'linux'
    needs: guard
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure + build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Verify package
        run: |
          binary=build/package/addons/BotVision/bin/linuxsteamrt64/BotVision.so
          test -f "$binary"
          test -f build/package/addons/metamod/BotVision.vdf
          max_glibc=$(readelf --version-info "$binary" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sort -Vu \
            | tail -1)
          test -n "$max_glibc"
          if [ "$(printf '%s\n' GLIBC_2.31 "$max_glibc" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::$binary requires $max_glibc, newer than SteamRT3's GLIBC_2.31"
            exit 1
          fi
          echo "$binary requires at most $max_glibc"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: BotVision-Linux-${{ needs.guard.outputs.version }}
          path: build/package/
          if-no-files-found: error

  # Publishes both platform packages
  release:
    if: inputs.release
    needs: [guard, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: BotVision-*
          path: artifacts

      - name: Zip packages
        run: |
          cd artifacts
          for directory in */; do
            directory="${directory%/}"
            (cd "$directory" && zip -qr "../$directory.zip" .)
            echo "packed $directory.zip"
          done
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2

      - name: Create tag + release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
